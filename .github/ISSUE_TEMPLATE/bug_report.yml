name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 135...
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL (if public)
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include any message from the toolbar icon tooltip or the page console (look for "[Chromalens]").
    validations:
      required: true
